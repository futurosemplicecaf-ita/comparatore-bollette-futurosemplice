name: Keep Streamlit App Awake

on:
  schedule:
    # Esegue il controllo ogni 6 ore
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permette l'avvio manuale per i test

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # Indirizzo della tua app Streamlit
          APP_URL="https://comparatore-bollette-futurosemplice-92ffj8el3bxenpzlx2tre2.streamlit.app/"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          echo "HTTP Status Received: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "App reached successfully!"
          else
            echo "Warning: Received HTTP status $HTTP_STATUS"
            exit 1
          fi
