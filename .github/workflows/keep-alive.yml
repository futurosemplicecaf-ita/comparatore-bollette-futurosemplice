name: Keep Streamlit App Awake

on:
  schedule:
    # Esegue il controllo ogni 6 ore
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permette l'avvio manuale per i test

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Wake up Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          url = 'https://comparatore-bollette-futurosemplice-92ffj8el3bxenpzlx2tre2.streamlit.app/'
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until='networkidle', timeout=60000)
              page.wait_for_timeout(5000)

              wake_button = page.get_by_role('button', name='Yes, get this app back up!')
              if wake_button.is_visible():
                  print('App in standby rilevata. Clicco il pulsante di risveglio...')
                  wake_button.click()
                  page.wait_for_timeout(15000)
                  print('Pulsante cliccato con successo!')
              else:
                  print('App gia attiva!')

              browser.close()
          "
