name: Keep Streamlit App Awake

on:
  schedule:
    # Esegue il controllo ogni 6 ore
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permette l'avvio manuale per testare

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit App
        uses: jv-k/streamlit-keep-alive@v1
        with:
          streamlit_app_url: ${{ secrets.STREAMLIT_APP_URL }}
